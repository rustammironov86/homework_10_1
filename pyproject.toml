[project]
name = "lesson-9-1-masks"
version = "0.1.0"
description = ""
authors = [
    {name = "rustam_mironov",email = "tatapuh9801@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv (>=1.1.0,<2.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "config (>=0.5.1,<0.6.0)",
    "logging (>=0.4.9.6,<0.5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.15.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"
pytest-cov = "^6.1.1"

[tool.black]
   line_length = 119
   exclude = ".git"

[tool.isort]
   line_length = 119
   multi_line_output = 1

[tool.mypy]
   line_length = 119
   exclude = ".venv"
   disallow_untyped_defs = true
   warn_return_any = true
